name: sync-upstream

# 把父仓库（upstream）的更新同步进本 fork：
#   - sync-main：维护 main 的不变量 upstream/main ∪ FORK_BRANCHES → build + test
#     验证 → push。上游有新提交就合并；main 被外部硬重置（Pull 应用默认行为）
#     导致 fork 独有分支不在 main 里，就自动合回来（自愈，见该 step 注释）。
#   - sync-tags：把上游新增的 v* tag 逐个推到 fork（保持"同名 tag 指同一提交"）
#   - sync-main 末尾：按 main 的 appVersion 打 fork 版本 tag（v1.11.11-panel）并派发
#     Release / 镜像构建（见下"两条版本线"）
#   触发：schedule 每日定时 + workflow_dispatch 手动
#
# 为什么 main 是 merge 而不是 --ff-only：
#   本 fork 的 main 长期带有上游没有的提交（PR#63：Codex Responses /
#   Anthropic Messages 入站适配；上游 2026-09-28 按项目定位取舍关闭、未合并）。
#   旧版 `git merge --ff-only` 一旦分叉就永远跳过同步——分叉是常态，等于从不同步。
#   现改为普通合并：冲突时中止（main 保持不动）并让 job 失败告警，交人工处理。
#
# 为什么同步得由本 workflow 负责（fork 侧根因）：
#   本仓库原先装了 Pull 应用（pull[bot]）。它在本 fork 没有 .github/pull.yml 时
#   默认按 hard reset 同步，会把 fork 独有提交连文件一起清掉（2026-09-30 的
#   28532ae / 31277f8 就是这样丢的）。.github/pull.yml 作为防重置兜底保留。
#
# 关于 tag：fork 有两条版本线，靠 tag 名区分（本文件头即完整约定）
#   1) 上游线 v1.11.11（sync-tags 同步）：tag 忠实指向上游提交，产物是纯上游代码。
#      注意 GITHUB_TOKEN 推 tag **不会**触发 push 事件的工作流（GitHub 硬规则，
#      2026-10-01 实测：sync-tags 首次推 v1.11.11 后 fork 侧零 tag 运行；同一天上游
#      13:16 发了 v1.11.11，而 fork 的 Releases 页停在 v1.11.10、ghcr 也缺 1.11.11，
#      但 tag 列表里 v1.11.11 明明是有的——就是这条规则的指纹）。因此上游线在 fork
#      里默认不产出 Release / 版本化镜像；需要时手动派发：
#        gh workflow run go-binaries.yml --ref v1.11.11   # 同理 docker-ghcr.yml
#   2) fork 线 v1.11.11-panel（sync-main 自动打）：tag 打在 fork main 上，产物含 PR#63
#      （Codex Responses / Anthropic Messages 入站），镜像 ghcr.io/...:1.11.11-panel。
#      同样受上述硬规则限制，故 sync-main 用 workflow_dispatch 显式派发（dispatch 是
#      该规则唯一的例外，官方文档：automatic-token-authentication / triggering-a-workflow）。
#      版本号没变就不重复发版；要为 fork 独有修复单独发版，把 appVersion 改成
#      1.11.11-panel.1 之类随 PR 合入 main 即可（go-binaries 断言认全称）。
#      若 gh workflow run 报 403（组织策略禁用 GITHUB_TOKEN 的 actions: write），
#      换一枚带 workflow scope 的 PAT 存为 secret，再把下面派发 step 的 GH_TOKEN 换成它。
#   同名 tag 已存在但指向不同提交时：报错并让人工确认，绝不强推改写 tag
#   （改写会破坏"同名 tag 指同一提交"的既有语义）。*-panel 保留给 fork 版本线，
#   sync-tags 不导入上游的同名 tag。
on:
  schedule:
    - cron: "0 3 * * *" # UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write # sync-main 用 gh workflow run 派发 fork 版本线的 Release / 镜像构建

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream (parent repo) + fork branches
        run: |
          git remote add upstream https://github.com/linguo2625469/workbuddy2api-panel.git
          git fetch upstream --prune
          git fetch origin --prune "+refs/heads/*:refs/remotes/origin/*" # fork 独有分支（main 自愈用；显式 refspec 不依赖 checkout 留下的配置）
          echo "behind: $(git rev-list --count HEAD..upstream/main)"
          echo "ahead:  $(git rev-list --count upstream/main..HEAD)"

      # main 的不变量：upstream/main ∪ FORK_BRANCHES。两步都是普通合并，绝不 reset/force：
      #   1) 上游有新提交 → 合并（保留本 fork 独有提交）
      #   2) fork 独有分支不在 main 历史里（main 被外部硬重置）→ 自动合回来
      # 因此即使 Pull 应用仍在本仓库硬重置 main，PR#63 也会在次日定时任务里自动恢复。
      - name: Sync main (merge upstream + ensure fork branches)
        id: sync
        env:
          FORK_BRANCHES: feat/anthropic-messages-responses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          changed=false

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "上游无新提交。"
          else
            sha=$(git rev-parse --short upstream/main)
            if git merge --no-ff -m "chore(sync): 自动合并上游 upstream/main@${sha}" upstream/main; then
              echo "已合并上游 ${sha}（fork 独有提交原样保留）"
              changed=true
            else
              git merge --abort || true
              echo "::error::上游合并存在冲突，已中止（main 未改动）。请本地处理：git fetch origin && git merge origin/main，解冲突后 push。"
              exit 1
            fi
          fi

          for br in $FORK_BRANCHES; do
            if ! git rev-parse --verify --quiet "origin/${br}" >/dev/null; then
              echo "::warning::origin/${br} 不存在，跳过（若该分支已不再需要，请从本文件的 FORK_BRANCHES 删掉）"
              continue
            fi
            if git merge-base --is-ancestor "origin/${br}" HEAD; then
              echo "main 已包含：${br}"
            elif git merge --no-ff -m "chore(sync): 恢复 fork 独有分支 ${br}" "origin/${br}"; then
              echo "main 缺失 ${br} 的内容（疑似被硬重置），已自动合回"
              changed=true
            else
              git merge --abort || true
              echo "::error::恢复 ${br} 时合并冲突，已中止（main 未改动）。"
              exit 1
            fi
          done

          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "本次有改动：${changed}"

      - name: Setup Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify merged tree (build + tests)
        if: steps.sync.outputs.changed == 'true'
        run: |
          if go build ./... && go test ./...; then
            echo "合并结果验证通过。"
          else
            git reset --hard "$BASE"
            echo "::error::合并结果未通过 build/test，已丢弃本次合并（main 未改动）。请本地复现：git fetch origin && git merge origin/main。"
            exit 1
          fi

      - name: Push to fork
        if: steps.sync.outputs.changed == 'true'
        run: git push origin main

      # fork 版本线：main 的 appVersion（如 1.11.11-panel）→ tag v1.11.11-panel。
      # 该 tag 的产物 = main（含 PR#63），与上游 tag（纯上游代码）区分开。
      # 版本号没变就不发新版（幂等）：需要为 fork 独有修复单独发版时，把 appVersion
      # 改成 1.11.11-panel.1 之类（go-binaries 的断言认全称），随 PR 合入即可。
      - name: fork 版本 tag（v<appVersion>）
        id: ver
        run: |
          VER=$(grep -oP 'appVersion = "\K[^"]+' cmd/server/main.go)
          if [ -z "$VER" ]; then
            echo "::error::没从 cmd/server/main.go 解析出 appVersion"
            exit 1
          fi
          TAG="v${VER}"
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' | head -1)
          if [ -z "$REMOTE_SHA" ]; then
            git push origin "HEAD:refs/tags/${TAG}"
            echo "已创建 fork 版本 tag：${TAG} -> $(git rev-parse --short HEAD)"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            # 绝不重写已存在的 tag（与 sync-tags 同一条纪律）
            if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
              echo "::warning::${TAG} 已存在但指向 ${REMOTE_SHA}，与当前 main $(git rev-parse --short HEAD) 不同；不重写 tag（要发新版请 bump appVersion）"
            else
              echo "${TAG} 已存在且指向当前 main，跳过（版本号未变 → 本次不发版）"
            fi
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN 推的 tag 不会触发 push 事件的工作流（GitHub 硬规则），
      # 所以这里显式派发；workflow_dispatch 不受该限制。
      - name: 触发 fork 版本产物（Release + 版本化镜像）
        if: steps.ver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh workflow run go-binaries.yml --ref "$TAG"
          gh workflow run docker-ghcr.yml --ref "$TAG"
          echo "已派发 ${TAG} 的 go-binaries 与 docker-ghcr；运行进度：https://github.com/${GITHUB_REPOSITORY}/actions"

  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # tag 指向的提交必须在本地，否则无法推送该 tag
          fetch-tags: true

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/linguo2625469/workbuddy2api-panel.git
          git fetch upstream --tags --prune

      - name: Push new upstream tags
        run: |
          # 逐个上游 v* tag 比对：fork 缺失则按上游的 sha 推送；同名但指向不同提交则报错
          # （不强推改写 tag）。用 ls-remote 取远端真实 sha，避免被本地同名旧 tag 误导。
          # 注意：这里用 GITHUB_TOKEN 推 tag，GitHub 不会因此启动 go-binaries / docker-ghcr
          # （GITHUB_TOKEN 事件不触发工作流）。上游线在 fork 的产物需要时手动派发：
          #   gh workflow run go-binaries.yml --ref <tag>   # 同理 docker-ghcr.yml
          # fork 自己的版本线由 sync-main 打 tag + 显式派发，见文件头的"两条版本线"。
          git ls-remote --tags --refs upstream | awk '{print $2" "$1}' | sed 's|refs/tags/||' > /tmp/up.txt
          git ls-remote --tags --refs origin   | awk '{print $2" "$1}' | sed 's|refs/tags/||' > /tmp/org.txt
          new=0
          bad=0
          while read -r tag sha; do
            case "$tag" in
              v*-panel*) echo "跳过上游的 *-panel tag（fork 版本线自有命名空间，避免撞名）：$tag"; continue ;;
              v*) ;;
              *) echo "跳过非 v* tag：$tag"; continue ;;
            esac
            osha=$(awk -v k="$tag" '$1 == k {print $2}' /tmp/org.txt)
            if [ -z "$osha" ]; then
              echo "推送新 tag：$tag -> $sha"
              git push origin "${sha}:refs/tags/${tag}" || bad=$((bad + 1))
              new=$((new + 1))
            elif [ "$osha" != "$sha" ]; then
              echo "::error::tag $tag 在 fork 上已存在但指向 $osha，与上游 $sha 不同；不会强推改写，请人工确认。"
              bad=$((bad + 1))
            else
              echo "已同步：$tag"
            fi
          done < /tmp/up.txt
          echo "本次新推 tag：$new，异常：$bad"
          [ "$bad" -eq 0 ]
