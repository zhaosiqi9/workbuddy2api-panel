name: sync-upstream

# 自动同步父仓库（upstream）更新：
#   - schedule 每日定时检查，父仓库有新提交时把本 fork 的 main 快进到上游
#   - workflow_dispatch 手动触发
#
# 说明：本仓库是 linguo2625469/workbuddy2api-panel 的 fork，父仓库即上游。
#   - 仅当本 fork 的 main 无本地独有提交时才快进；一旦出现分叉就跳过并在
#     日志里告警，交给人工 rebase / PR，避免定时任务把分叉静默合并掉。
#   - 默认只同步 main、不推 tag：推 v* tag 会在本 fork 触发 go-binaries 的
#     Release 打包与 docker-ghcr 的多架构镜像构建。确实需要 tag 时，把下面
#     push 步骤的 --follow-tags 打开即可。
#   - 快进后 push 到本 fork 的 main，会照常触发 go-binaries / docker-ghcr。
on:
  schedule:
    - cron: "0 3 * * *" # UTC 03:00 = 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream (parent repo)
        run: |
          git remote add upstream https://github.com/linguo2625469/workbuddy2api-panel.git
          git fetch upstream --prune

      - name: Fast-forward main if possible
        id: ff
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind: $behind"
          echo "ahead:  $(git rev-list --count upstream/main..HEAD)"
          if [ "$behind" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "已是最新，无需同步。"
          elif git merge-base --is-ancestor HEAD upstream/main; then
            git merge --ff-only upstream/main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本 fork 的 main 存在上游没有的提交，已跳过自动同步；请人工 rebase 或开 PR。"
          fi

      - name: Push to fork
        if: steps.ff.outputs.changed == 'true'
        run: git push origin main
